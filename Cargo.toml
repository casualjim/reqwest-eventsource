[package]
name = "reqwest-middleware-eventsource"
version = "0.6.0"
authors = ["Julian Popescu <jpopesculian@gmail.com>"]
edition = "2018"
resolver = "2"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/jpopesculian/reqwest-eventsource"
documentation = "https://docs.rs/reqwest-eventsource/"
repository = "https://github.com/jpopesculian/reqwest-eventsource"
description = "Helper to build an Eventsource using reqwest"
keywords = ["sse", "eventsource", "reqwest", "stream", "event"]
categories = [
  "web-programming::http-client",
  "no-std",
  "parsing",
  "asynchronous",
]

[dependencies]
eventsource-stream = "0.2.3"
reqwest = { version = "0.12.22", default-features = false, features = [
  "stream",
] }
reqwest-middleware = { version = "0.4.2" }
futures-util = "0.3.31"
futures-core = "0.3.31"
pin-project-lite = "0.2.16"
nom = "7"
mime = "0.3.17"
futures-timer = "3.0.3"
thiserror = "2.0.12"

[dev-dependencies]
futures = "0.3.31"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
futures-retry = "0.6.0"
pin-utils = "0.1.0"
rocket = "0.5.1"
